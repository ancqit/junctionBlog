<section class="login">
  <p class="kicker">optional</p>
  <h1>OTP via junctionBack</h1>
  <p class="muted">You can create a blog with only a name. OTP links a mobile number.</p>

  @if (step() === 'details') {
    <form class="card form" (ngSubmit)="sendOtp()">
      <label class="field">
        <span>Name</span>
        <input name="displayName" [(ngModel)]="displayName" />
      </label>
      <label class="field">
        <span>Mobile</span>
        <input name="phoneNumber" [(ngModel)]="phoneNumber" maxlength="10" inputmode="numeric" placeholder="10-digit" />
      </label>
      @if (error()) {
        <p class="err">{{ error() }}</p>
      }
      <button class="btn btn-primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Sending…' : 'Send OTP' }}
      </button>
    </form>
  } @else {
    <form class="card form" (ngSubmit)="verifyOtp()">
      <p class="muted">Code sent to {{ e164Phone }}</p>
      @if (debugOtp()) {
        <p>Debug OTP {{ debugOtp() }}</p>
      }
      <label class="field">
        <span>OTP</span>
        <input name="otp" [(ngModel)]="otp" maxlength="6" inputmode="numeric" />
      </label>
      @if (error()) {
        <p class="err">{{ error() }}</p>
      }
      <button class="btn btn-primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Verifying…' : 'Verify' }}
      </button>
    </form>
  }
</section>
